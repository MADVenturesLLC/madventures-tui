name: code-review

# Automatic status/comment publication is same-repository only.
# Fork PRs still run the read-only validate job, but do not auto-publish
# a code-review status or evidence comment. Maintainers refresh any PR
# (including forks) via workflow_dispatch with pr_number.

on:
  pull_request:
    branches:
      - main
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose frozen head should be rechecked.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      test: ${{ steps.test.outcome }}
      head_sha: ${{ steps.freeze.outputs.head_sha }}
    steps:
      - name: Checkout frozen PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/pull/{0}/head', inputs.pr_number) || github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record frozen PR head
        id: freeze
        run: echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Test
        id: test
        run: bun test
        continue-on-error: true

  # Automatic publish path: same-repository PR events only.
  # Maintainer path: workflow_dispatch with pr_number (any PR, including forks).
  # Write permissions stay out of the job that checks out / runs PR head code.
  code-review:
    name: code-review
    needs: validate
    if: ${{ always() && !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Quote PR context (freeze-and-quote)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TYPECHECK_OUTCOME: ${{ needs.validate.outputs.typecheck }}
          TEST_OUTCOME: ${{ needs.validate.outputs.test }}
          VALIDATED_HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const eventPr = context.payload.pull_request;
            const prNumber = eventPr?.number || Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(prNumber) || prNumber <= 0) {
              core.setFailed("a pull request number is required");
              return;
            }

            // Pull request aggregate totals remain complete for large diffs.
            const prData = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            const pr = prData.data;
            const validatedHeadSha = process.env.VALIDATED_HEAD_SHA || "";
            if (validatedHeadSha !== pr.head.sha) {
              core.setFailed(
                `validated head ${validatedHeadSha || "missing"} does not match current head ${pr.head.sha}`
              );
              return;
            }
            const {
              commits,
              additions,
              deletions,
              changed_files: filesChanged,
            } = prData.data;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const codeRabbitReviews = reviews.filter((review) => {
              const login = review.user?.login || "";
              return login === "coderabbitai[bot]" || login === "coderabbit[bot]";
            }).length;

            let unresolvedThreads = 0;
            let cursor = null;
            do {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`,
                { owner, repo, number: prNumber, cursor }
              );
              const threads = data.repository.pullRequest.reviewThreads;
              unresolvedThreads += threads.nodes.filter(
                (thread) => !thread.isResolved
              ).length;
              cursor = threads.pageInfo.hasNextPage
                ? threads.pageInfo.endCursor
                : null;
            } while (cursor);

            const typecheck = process.env.TYPECHECK_OUTCOME || "skipped";
            const test = process.env.TEST_OUTCOME || "skipped";
            const gatePass = typecheck === "success" && test === "success";
            const threadClean = unresolvedThreads === 0;

            const summary = [
              "freeze-and-quote: code-review check (os-bridge)",
              `head=${validatedHeadSha} base=${pr.base.sha} commits=${commits}`,
              `diff: +${additions}/-${deletions} files_changed=${filesChanged}`,
              `gates: typecheck=${typecheck} test=${test}`,
              `reviews: coderabbit=${codeRabbitReviews} unresolved_threads=${unresolvedThreads}`,
            ].join("\n");

            // The contract marker is stable across heads; migrate the prior,
            // PR-numbered marker instead of creating a duplicate evidence comment.
            const marker = `<!-- os-bridge:code-review quote -->`;
            const legacyMarker = `<!-- os-bridge:code-review quote pr=${prNumber} -->`;
            const legacyHeadMarker =
              `<!-- os-bridge:code-review quote pr=${prNumber} head=`;
            const body = `${marker}\n\`\`\`\n${summary}\n\`\`\``;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            const existing = comments.find((comment) =>
              (comment.body || "").startsWith(marker) ||
              (comment.body || "").startsWith(legacyMarker) ||
              (comment.body || "").startsWith(legacyHeadMarker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }

            const statusState = gatePass && threadClean ? "success" : "failure";
            const statusDescription = !gatePass
              ? `gate failure: typecheck=${typecheck} test=${test}`
              : !threadClean
                ? `unresolved threads present (${unresolvedThreads})`
                : "typecheck and tests passed; review threads resolved";
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: validatedHeadSha,
              state: statusState,
              context: "code-review",
              description: statusDescription,
              target_url: `${process.env.GITHUB_SERVER_URL}/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            });

            if (!gatePass) {
              core.setFailed(
                `gate failure: typecheck=${typecheck} test=${test}`
              );
            } else if (!threadClean) {
              core.setFailed(
                `unresolved threads present (${unresolvedThreads}); resolve before approval`
              );
            }

  # Fork PRs: no automatic code-review status or evidence comment.
  # This job is notice-only and has no write permissions.
  fork-pr-notice:
    name: fork-pr-notice
    if: ${{ github.event_name != 'workflow_dispatch' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Explain fork publication boundary
        run: |
          echo "::notice::Fork PR detected. Automatic code-review status and evidence-comment publication is limited to same-repository PRs."
          echo "validate-code-review still runs read-only against the fork head."
          echo "Maintainers refresh publication via workflow_dispatch with pr_number."
          echo "This job does not publish a code-review status or PR comment."
