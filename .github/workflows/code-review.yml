name: code-review

on:
  pull_request:
    branches:
      - main
  pull_request_review:
    types:
      - submitted
      - edited
      - dismissed
  pull_request_review_comment:
    types:
      - created
      - edited
      - deleted

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate-code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      test: ${{ steps.test.outcome }}
    steps:
      - name: Checkout frozen PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Test
        id: test
        run: bun test
        continue-on-error: true

  code-review:
    name: code-review
    needs: validate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Quote PR context (freeze-and-quote)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TYPECHECK_OUTCOME: ${{ needs.validate.outputs.typecheck }}
          TEST_OUTCOME: ${{ needs.validate.outputs.test }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            // Pull request aggregate totals remain complete for large diffs.
            const prData = await github.rest.pulls.get({
              owner, repo, pull_number: prNumber,
            });
            const {
              commits,
              additions,
              deletions,
              changed_files: filesChanged,
            } = prData.data;

            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const codeRabbitReviews = reviews.filter((review) => {
              const login = review.user?.login || "";
              return login === "coderabbitai[bot]" || login === "coderabbit[bot]";
            }).length;

            let unresolvedThreads = 0;
            let cursor = null;
            do {
              const data = await github.graphql(
                `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      reviewThreads(first: 100, after: $cursor) {
                        nodes { isResolved }
                        pageInfo { hasNextPage endCursor }
                      }
                    }
                  }
                }`,
                { owner, repo, number: prNumber, cursor }
              );
              const threads = data.repository.pullRequest.reviewThreads;
              unresolvedThreads += threads.nodes.filter(
                (thread) => !thread.isResolved
              ).length;
              cursor = threads.pageInfo.hasNextPage
                ? threads.pageInfo.endCursor
                : null;
            } while (cursor);

            const typecheck = process.env.TYPECHECK_OUTCOME || "skipped";
            const test = process.env.TEST_OUTCOME || "skipped";
            const gatePass = typecheck === "success" && test === "success";
            const threadClean = unresolvedThreads === 0;

            const summary = [
              "freeze-and-quote: code-review check (os-bridge)",
              `head=${pr.head.sha} base=${pr.base.sha} commits=${commits}`,
              `diff: +${additions}/-${deletions} files_changed=${filesChanged}`,
              `gates: typecheck=${typecheck} test=${test}`,
              `reviews: coderabbit=${codeRabbitReviews} unresolved_threads=${unresolvedThreads}`,
            ].join("\n");

            // One stable marker means a new head updates, rather than duplicates,
            // this PR's evidence comment.
            const marker = `<!-- os-bridge:code-review quote pr=${prNumber} -->`;
            const body = `${marker}\n\`\`\`\n${summary}\n\`\`\``;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            const existing = comments.find((comment) =>
              (comment.body || "").startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: prNumber, body,
              });
            }

            if (!gatePass) {
              core.setFailed(
                `gate failure: typecheck=${typecheck} test=${test}`
              );
            } else if (!threadClean) {
              core.setFailed(
                `unresolved threads present (${unresolvedThreads}); resolve before approval`
              );
            }
