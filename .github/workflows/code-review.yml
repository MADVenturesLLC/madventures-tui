name: code-review

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-review:
    name: code-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        run: bunx tsc --noEmit
        continue-on-error: true

      - name: Test
        id: test
        run: bun test
        continue-on-error: true

      - name: Quote PR context (freeze-and-quote)
        if: always()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const prNumber = pr && pr.number;

            // Diff stats: number of commits on the PR + insertions/deletions
            const cmp = await github.rest.repos.compareCommits({
              owner, repo,
              base: pr.base.sha,
              head: pr.head.sha,
            });
            const commits = cmp.data.commits.length;
            const additions = cmp.data.files
              ? cmp.data.files.reduce((n, f) => n + (f.additions || 0), 0)
              : 0;
            const deletions = cmp.data.files
              ? cmp.data.files.reduce((n, f) => n + (f.deletions || 0), 0)
              : 0;
            const filesChanged = cmp.data.files ? cmp.data.files.length : 0;

            // Reviews + unresolved threads
            const reviews = await github.paginate(
              github.rest.pulls.listReviews,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            let codeRabbitReviews = 0;
            for (const r of reviews) {
              const u = (r.user && r.user.login) || "";
              if (u === "coderabbitai[bot]" || u === "coderabbit[bot]") {
                codeRabbitReviews += 1;
              }
            }

            const threads = await github.paginate(
              github.rest.pulls.listReviewThreads,
              { owner, repo, pull_number: prNumber, per_page: 100 }
            );
            const unresolvedThreads = threads.filter(
              (t) => t.state === "unresolved"
            ).length;

            // Job conclusions live in ${{ steps.<id>.conclusion }} in the workflow;
            // surface them here via job inputs because `steps` is not in
            // github-script's runtime.
            const typecheck = process.env.TYPECHECK_CONCLUSION || "skip";
            const testConclusion = process.env.TEST_CONCLUSION || "skip";
            const gatePass =
              typecheck === "success" && testConclusion === "success";
            const threadClean = unresolvedThreads === 0;

            const lines = [];
            lines.push("freeze-and-quote: code-review check (os-bridge)");
            lines.push(
              `head=${pr.head.sha} base=${pr.base.sha} commits=${commits}`
            );
            lines.push(
              `diff: +${additions}/-${deletions} files_changed=${filesChanged}`
            );
            lines.push(
              `gates: typecheck=${typecheck} test=${testConclusion}`
            );
            lines.push(
              `reviews: coderabbit=${codeRabbitReviews} unresolved_threads=${unresolvedThreads}`
            );
            const summary = lines.join("\n");

            // Post a single, idempotent status comment holding the evidence.
            const marker = `<!-- os-bridge:code-review quote pr=${prNumber} head=${pr.head.sha} -->`;
            const body = `${marker}\n\`\`\`\n${summary}\n\`\`\``;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            const existing = comments.find((c) =>
              (c.body || "").startsWith(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body,
              });
            }

            // Fail the job when evidence disagrees with a green claim.
            if (!gatePass) {
              core.setFailed(
                `gate failure: typecheck=${typecheck} test=${testConclusion}`
              );
            } else if (!threadClean) {
              core.setFailed(
                `unresolved threads present (${unresolvedThreads}); resolve before approval`
              );
            }
        env:
          TYPECHECK_CONCLUSION: ${{ steps.typecheck.conclusion }}
          TEST_CONCLUSION: ${{ steps.test.conclusion }}
