name: proving-ground

# Adversarial Proving Ground v0 — deterministic challenge suite.
#
#   PROVING_GROUND — NOT PHASE_0 — NOT OCCUPANCY_PROOF
#
# Runs `proving-ground run --suite v0` on both lanes. The suite is
# deterministic (fixed seed; flaky challenges are quarantined and excluded;
# environment-gated challenges skip with an explicit reason and never count
# as green). Lane duplication (not a matrix) mirrors verify.yml.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proving-ground:
    name: proving-ground (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: MADVenturesLLC/madventures-tui/.github/actions/setup-qualified-bun@d057994a6663a7b56f5603f109b33d79bef333ef
        with:
          custody-token: ${{ secrets.ARTIFACTS_READ_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run proving-ground suite
        run: bun packages/proving-ground/src/cli.ts run --suite v0

      - name: Upload evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proving-ground-evidence-ubuntu
          path: testdata/proving-ground/runs/
          if-no-files-found: warn

  proving-ground-macos:
    name: proving-ground (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: MADVenturesLLC/madventures-tui/.github/actions/setup-qualified-bun@d057994a6663a7b56f5603f109b33d79bef333ef
        with:
          custody-token: ${{ secrets.ARTIFACTS_READ_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run proving-ground suite
        run: bun packages/proving-ground/src/cli.ts run --suite v0

      - name: Upload evidence packet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proving-ground-evidence-macos
          path: testdata/proving-ground/runs/
          if-no-files-found: warn
