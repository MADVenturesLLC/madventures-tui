name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: MADVenturesLLC/madventures-tui/.github/actions/setup-qualified-bun@d057994a6663a7b56f5603f109b33d79bef333ef
        with:
          custody-token: ${{ secrets.ARTIFACTS_READ_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # Task 34 script proof: the four Phase 3A package scripts land in this
      # task; test:arch and test:phase3a are green at this base and wired
      # here. test:adversarial and verify:phase3a are DEFINED but NOT wired:
      # their targets (test/phase3a/adversarial, harness suites) arrive in
      # M22–M23, and wiring a known-red step would block every PR until then.
      - name: Task 34 scripts (arch + phase3a)
        run: |
          bun run test:arch
          bun run test:phase3a

  # A SECOND JOB, not a matrix on `verify`. A matrix would rename the existing
  # check to `Verify (ubuntu-24.04)` and the required check named `Verify` would
  # silently stop existing — branch protection would then pass with nothing
  # enforcing it. Duplicating five steps is the cheaper mistake.
  #
  # Why macOS at all: on 2026-08-21 a control script shipped a defect that no
  # amount of reading caught — three LLM reviewers read the diff clean. In a BSD
  # `strptime` format `Z` is a literal to match, not a UTC designator, so
  # `date -j -f '...%SZ'` parsed a UTC timestamp as local time and the script
  # failed on any Mac not set to UTC. Only running it on macOS surfaced that.
  # Linux CI cannot find this class of bug by construction.
  #
  # ARM64 ONLY. macos-14 is Apple Silicon. This lane therefore covers one half
  # of what M17 certifies — the dual-host gate is Intel AND Apple Silicon, and a
  # green run here says nothing about the Intel half. Adding the Intel lane
  # (`macos-15-intel`) is deliberately NOT done here: it is the next Founder
  # decision, not a builder's to make. Until it is made, read this job as
  # partial macOS coverage rather than macOS coverage.
  verify-macos:
    name: Verify (macOS)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: MADVenturesLLC/madventures-tui/.github/actions/setup-qualified-bun@d057994a6663a7b56f5603f109b33d79bef333ef
        with:
          custody-token: ${{ secrets.ARTIFACTS_READ_TOKEN }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      # A timezone-dependent bug is invisible when the runner is UTC, which
      # GitHub runners are. This is the exact condition that hid the defect
      # above from every check that ran.
      - name: Test (non-UTC timezone)
        env:
          TZ: America/New_York
        run: bun test

      # Task 34 script proof on macOS (see the ubuntu job's note: only the
      # green scripts are wired; adversarial waits for M22–M23).
      - name: Task 34 scripts (arch + phase3a)
        run: |
          bun run test:arch
          bun run test:phase3a
