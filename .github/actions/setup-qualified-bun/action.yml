name: Setup Qualified Bun
description: >-
  TEMPORARY_UPSTREAM_PR_RUNTIME — install the custodied Bun revision
  69cb78c9097cebd3bdb832d9fff8b7d23abce09e from the governed custody tag
  (read-only), verify against MANIFEST.sha256, prove identity, gate on the
  REV 06 expiry state machine, and export the runtime path. Excluded from
  production CI adoption; auto-sunset when an official Bun release contains
  the fix (Path N) or rollback restores governed 1.3.14 (Path R).
inputs:
  custody-token:
    description: >-
      ARTIFACTS_READ_TOKEN — fine-grained PAT with contents:read on
      MADVenturesLLC/os-governed-artifacts only.
    required: true
outputs:
  bun-path:
    description: Absolute path to the qualified bun binary.
    value: ${{ steps.export.outputs.bun-path }}
runs:
  using: composite
  steps:
    - name: Checkout custody tag (read-only)
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: MADVenturesLLC/os-governed-artifacts
        ref: refs/tags/intake/bun-pr40304-69cb78c9097cebd3bdb832d9fff8b7d23abce09e/v1
        token: ${{ inputs.custody-token }}
        path: custody
        persist-credentials: false

    - name: Verify manifest (5/5 green)
      run: |
        cd "$GITHUB_WORKSPACE/custody"
        shasum -a 256 -c MANIFEST.sha256
      shell: bash

    - name: Select platform archive
      id: select
      run: |
        OS="$(uname -s)"
        ARCH="$(uname -m)"
        case "$OS-$ARCH" in
          Linux-x86_64)  ZIP=bun-linux-x64.zip ;;
          Darwin-arm64)  ZIP=bun-darwin-aarch64.zip ;;
          *)
            echo "::error::unsupported runner $OS-$ARCH"
            exit 1
            ;;
        esac
        echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Extract qualified bun
      run: |
        cd "$GITHUB_WORKSPACE/custody"
        unzip -o "${{ steps.select.outputs.zip }}" -d qrt
      shell: bash

    - name: Prove runtime identity (bun + bunx)
      run: |
        set -euo pipefail
        # The qualified zip extracts to a platform subdirectory
        # (qrt/bun-linux-x64/bun, qrt/bun-darwin-aarch64/bun).
        BUN_DIR="$(dirname "$(find "$GITHUB_WORKSPACE/custody/qrt" -type f -name bun -perm -u+x | head -1)")"
        # The qualified zip ships only `bun`; `bunx` is required by
        # `bun run verify` and `bunx tsc --noEmit` (Commission 03 REV 02
        # Gate F fix, proven on ubuntu-24.04 x64).
        ln -s bun "$BUN_DIR/bunx"
        echo "$BUN_DIR" >> "$GITHUB_PATH"
        command -v bun
        command -v bunx
        bun --version
        REV="$(bun -e 'process.stdout.write(Bun.revision)')"
        echo "Bun.revision=$REV"
        test "$REV" = "69cb78c9097cebd3bdb832d9fff8b7d23abce09e"
      shell: bash

    - name: Expiry guard (REV 06 state machine)
      run: |
        set -euo pipefail
        REV="69cb78c9097cebd3bdb832d9fff8b7d23abce09e"
        CUTOFF="2026-08-23T00:00:00Z"
        API="https://api.github.com"
        AUTH="Authorization: Bearer ${{ github.token }}"
        ACCEPT="Accept: application/vnd.github+json"

        # S0: fetch PR 40304. API failure -> FAIL_CLOSED.
        PR_JSON="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" "$API/repos/oven-sh/bun/pulls/40304")" \
          || { echo "::error::S0 API failure"; exit 1; }
        STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
        MERGED="$(printf '%s' "$PR_JSON" | jq -r '.merged')"

        # REV 06: S1 (upstream-head expiry) removed — the custodied artifact
        # is immutable; upstream PR movement is not an expiry condition.
        case "$STATE" in
          open)
            ANCHOR="$REV"
            ;;
          closed)
            if [ "$MERGED" = "true" ]; then
              ANCHOR="$(printf '%s' "$PR_JSON" | jq -r '.merge_commit_sha')"
            else
              echo "::error::EXPIRED: PR 40304 closed unmerged"
              exit 1
            fi
            ;;
          *)
            echo "::error::FAIL_CLOSED: unexpected state '$STATE'"
            exit 1
            ;;
        esac

        # S4: containment scan over official releases >= CUTOFF.
        # ahead|identical -> EXPIRED; behind|diverged -> provably NOT
        # contained; anything else -> UNDETERMINED -> FAIL_CLOSED.
        PAGE=1
        while :; do
          RELEASES="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
            "$API/repos/oven-sh/bun/releases?per_page=100&page=$PAGE")" \
            || { echo "::error::S4 API failure"; exit 1; }
          COUNT="$(printf '%s' "$RELEASES" | jq 'length')"
          [ "$COUNT" -eq 0 ] && break
          for TAG in $(printf '%s' "$RELEASES" | jq -r --arg cutoff "$CUTOFF" \
            '.[] | select(.draft == false) | select(.published_at >= $cutoff) | .tag_name'); do
            TAG_JSON="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
              "$API/repos/oven-sh/bun/git/ref/tags/$TAG")" \
              || { echo "::error::S4 unpeelable tag ref $TAG"; exit 1; }
            TAG_TYPE="$(printf '%s' "$TAG_JSON" | jq -r '.object.type')"
            if [ "$TAG_TYPE" = "tag" ]; then
              TAG_OBJ_SHA="$(printf '%s' "$TAG_JSON" | jq -r '.object.sha')"
              TAG_OBJ="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
                "$API/repos/oven-sh/bun/git/tags/$TAG_OBJ_SHA")" \
                || { echo "::error::S4 unpeelable tag object $TAG"; exit 1; }
              TAG_COMMIT="$(printf '%s' "$TAG_OBJ" | jq -r '.object.sha')"
            else
              TAG_COMMIT="$(printf '%s' "$TAG_JSON" | jq -r '.object.sha')"
            fi
            COMPARE="$(curl -fsSL -H "$AUTH" -H "$ACCEPT" \
              "$API/repos/oven-sh/bun/compare/$ANCHOR...$TAG_COMMIT")" \
              || { echo "::error::S4 compare failure $TAG"; exit 1; }
            STATUS="$(printf '%s' "$COMPARE" | jq -r '.status')"
            case "$STATUS" in
              ahead|identical)
                echo "::error::EXPIRED: official release $TAG contains the fix"
                exit 1
                ;;
              behind|diverged)
                : # provably NOT contained — proceed
                ;;
              *)
                echo "::error::FAIL_CLOSED: UNDETERMINED status '$STATUS' for $TAG"
                exit 1
                ;;
            esac
          done
          PAGE=$((PAGE + 1))
        done
        echo "::notice::Expiry guard passed (REV 06): no official release contains $ANCHOR"
      shell: bash

    - name: Export runtime path
      id: export
      run: |
        echo "bun-path=$(command -v bun)" >> "$GITHUB_OUTPUT"
      shell: bash
